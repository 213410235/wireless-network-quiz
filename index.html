<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>無線網路測驗系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 18px;
        }

        .score-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content {
            padding: 40px;
        }

        .chapter-selection {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .chapter-btn {
            padding: 20px;
            border: 2px solid #667eea;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
        }

        .chapter-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .chapter-btn.selected {
            background: #667eea;
            color: white;
        }

        .question-number {
            color: #667eea;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #333;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            padding: 18px 25px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateX(5px);
        }

        .option.selected {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .option.correct {
            border-color: #4caf50;
            background: #e8f5e9;
            animation: correctAnim 0.5s ease;
        }

        .option.wrong {
            border-color: #f44336;
            background: #ffebee;
            animation: wrongAnim 0.5s ease;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .option-marker {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .option.correct .option-marker {
            background: #4caf50;
            border-color: #4caf50;
            color: white;
        }

        .option.wrong .option-marker {
            background: #f44336;
            border-color: #f44336;
            color: white;
        }

        @keyframes correctAnim {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        @keyframes wrongAnim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-next {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-restart, .btn-back {
            background: #f5f5f5;
            color: #333;
        }

        .btn-restart:hover, .btn-back:hover {
            background: #e0e0e0;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .feedback.correct {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }

        .feedback.wrong {
            background: #ffebee;
            color: #c62828;
            display: block;
        }

        .final-score {
            text-align: center;
            padding: 40px;
        }

        .final-score h2 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 20px;
        }

        .final-score .score-display {
            font-size: 48px;
            font-weight: bold;
            color: #764ba2;
            margin: 20px 0;
        }

        .final-score .message {
            font-size: 20px;
            color: #666;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
        }

        .start-btn {
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .view-bank-btn {
            padding: 15px 40px;
            background: #f5f5f5;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .view-bank-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .question-bank {
            max-height: 70vh;
            overflow-y: auto;
        }

        .bank-item {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 15px;
        }

        .bank-question {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .bank-options {
            margin-left: 20px;
        }

        .bank-option {
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            background: #f9f9f9;
        }

        .bank-option.correct {
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: bold;
            border-left: 4px solid #4caf50;
        }

        .chapter-divider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="headerTitle">無線網路測驗系統</h1>
            <div class="score-board" id="scoreBoard" style="display: none;">
                <div class="score-item">
                    <span>題號：</span>
                    <span id="currentQuestion">1</span>/<span id="totalQuestions">0</span>
                </div>
                <div class="score-item">
                    <span>✓ 答對：</span>
                    <span id="correctCount">0</span>
                </div>
                <div class="score-item">
                    <span>✗ 答錯：</span>
                    <span id="wrongCount">0</span>
                </div>
            </div>
            <div style="margin-top: 15px; display: none;" id="progressBarContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </div>

        <div class="content" id="mainContent">
            <h2 style="text-align: center; color: #667eea; margin-bottom: 30px;">請選擇章節</h2>
            <div class="chapter-selection" id="chapterSelection">
                <button class="chapter-btn" onclick="selectChapter(5)">
                    第5章<br>無線寬頻網路<br>(48題)
                </button>
                <button class="chapter-btn" onclick="selectChapter(6)">
                    第6章<br>電信網路<br>(49題)
                </button>
                <button class="chapter-btn" onclick="selectChapter(7)">
                    第7章<br>水下感測網路<br>(40題)
                </button>
                <button class="chapter-btn" onclick="selectChapter(8)">
                    第8章<br>無線體域網路<br>(35題)
                </button>
                <button class="chapter-btn" onclick="selectChapter(9)">
                    第9章<br>車載資通訊網路<br>(48題)
                </button>
            </div>
            <div style="text-align: center;">
                <button class="start-btn" onclick="selectChapter('all')">全部章節測驗 (220題)</button>
                <button class="view-bank-btn" onclick="showBankMenu()">📖 查看題庫</button>
            </div>
        </div>

        <div class="content" id="bankMenuContent" style="display: none;">
            <h2 style="text-align: center; color: #667eea; margin-bottom: 30px;">選擇要查看的章節題庫</h2>
            <div class="chapter-selection">
                <button class="chapter-btn" onclick="viewQuestionBank(5)">
                    第5章<br>無線寬頻網路<br>(48題)
                </button>
                <button class="chapter-btn" onclick="viewQuestionBank(6)">
                    第6章<br>電信網路<br>(49題)
                </button>
                <button class="chapter-btn" onclick="viewQuestionBank(7)">
                    第7章<br>水下感測網路<br>(40題)
                </button>
                <button class="chapter-btn" onclick="viewQuestionBank(8)">
                    第8章<br>無線體域網路<br>(35題)
                </button>
                <button class="chapter-btn" onclick="viewQuestionBank(9)">
                    第9章<br>車載資通訊網路<br>(48題)
                </button>
            </div>
            <div style="text-align: center;">
                <button class="start-btn" onclick="viewQuestionBank('all')">查看全部章節題庫 (220題)</button>
            </div>
            <div class="buttons" style="margin-top: 30px;">
                <button class="btn btn-back" onclick="backToMenu()">返回選單</button>
            </div>
        </div>

        <div class="content" id="questionBankContent" style="display: none;">
            <div class="question-bank" id="questionBankList"></div>
            <div class="buttons" style="margin-top: 30px;">
                <button class="btn btn-back" onclick="showBankMenu()">返回章節選擇</button>
                <button class="btn btn-restart" onclick="backToMenu()">返回主選單</button>
            </div>
        </div>

        <div class="content" id="quizContent" style="display: none;">
            <div class="question-number" id="questionNumber">第 1 題</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="optionsContainer"></div>
            <div class="feedback" id="feedback"></div>
            <div class="buttons">
                <button class="btn btn-next" id="nextBtn" style="display: none;">下一題</button>
                <button class="btn btn-restart" id="restartBtn">重新開始</button>
                <button class="btn btn-back" id="backBtn">返回選單</button>
            </div>
        </div>
    </div>

    <script>
        const allQuestions = {
            5: [
                {question: "WiMAX 點對多點架構中，MS 與 SS 的差異在於？", options: [{text: "頻段", correct: false}, {text: "訊框結構", correct: false}, {text: "調變技術", correct: false}, {text: "移動性", correct: true}]},
                {question: "WiMAX-2005 (802.16e) 主要新增？", options: [{text: "Relaying", correct: false}, {text: "Mesh 支援", correct: false}, {text: "固接式優化", correct: false}, {text: "移動用戶支持", correct: true}]},
                {question: "OFDM 在每個符元中加入何者以消除多徑效應？", options: [{text: "零填充", correct: false}, {text: "子載波", correct: false}, {text: "前導封包", correct: false}, {text: "循環字首", correct: true}]},
                {question: "OFDM (Orthogonal Frequency Division Multiplexing) 不具下列哪一項優點？", options: [{text: "頻譜使用率高", correct: false}, {text: "高資料傳輸能力", correct: false}, {text: "有效解決通訊傳輸中的頻率干擾", correct: false}, {text: "調變系統複雜度較單載波系統低", correct: true}]},
                {question: "Smart Antenna 技術源於哪一概念？", options: [{text: "MIMO Array", correct: false}, {text: "Diversity Array", correct: false}, {text: "Beamforming Array", correct: false}, {text: "Adaptive Antenna Array", correct: true}]},
                {question: "在 OFDMA 框架圖中，前導封包 (Preamble) 功能主要是？", options: [{text: "定義QoS", correct: false}, {text: "資源分配", correct: false}, {text: "加密交換", correct: false}, {text: "實體層同步", correct: true}]},
                {question: "下列哪一項不是無線個人網路系統？", options: [{text: "UWB", correct: false}, {text: "WiMAX", correct: true}, {text: "ZigBee", correct: false}, {text: "Bluetooth", correct: false}]},
                {question: "WiMAX 相較 Wi-Fi 最大差異在於？", options: [{text: "加密方式", correct: false}, {text: "加密強度", correct: false}, {text: "調變方式", correct: false}, {text: "傳輸距離", correct: true}]},
                {question: "請問下列對 WiMAX 敘述何者錯誤？", options: [{text: "應用於手機和電腦無線終端設備", correct: false}, {text: "現有的 3G 基地台升級後仍無法使用 WiMAX 基地台", correct: false}, {text: "使用 OFDMA 技術", correct: false}, {text: "又稱為 802.16m", correct: true}]},
                {question: "OFDMA 相比於 OFDM，其最大優勢在於？", options: [{text: "更低延遲", correct: false}, {text: "更少子載波", correct: false}, {text: "更高調變階數", correct: false}, {text: "提升頻寬利用率", correct: true}]},
                {question: "Worldwide Interoperability for Microwave Access 對應的中文是？", options: [{text: "無線區域網路", correct: false}, {text: "無線感測網路", correct: false}, {text: "無線隨意網路", correct: false}, {text: "無線微波互通存取", correct: true}]},
                {question: "在 WiMAX Point-to-Multipoint 架構中，BS 代表？", options: [{text: "Broadcaster Station", correct: false}, {text: "Backbone Station", correct: false}, {text: "Bridge Station", correct: false}, {text: "Base Station", correct: true}]},
                {question: "在 WiMAX 無線寬頻網路運作中，Basic Capability Negotiation 中，MS 向 BS 發送 SBC-REQ 後，BS 回應稱為？", options: [{text: "UL-MAP", correct: false}, {text: "DL-MAP", correct: false}, {text: "RNG-RSP", correct: false}, {text: "SBC-RSP", correct: true}]},
                {question: "IEEE 802.16-2012 標準又稱？", options: [{text: "802.16a", correct: false}, {text: "802.16e", correct: false}, {text: "802.16j", correct: false}, {text: "802.16m", correct: true}]},
                {question: "下列哪一項技術開始支援 WiMAX 多躍轉傳 (Multihop Relay) 中繼台轉傳機制？", options: [{text: "802.16-2004/802.16d", correct: false}, {text: "802.16-2005/802.16e", correct: false}, {text: "802.16-2009/802.16j", correct: false}, {text: "802.16-2012/802.16m", correct: true}]},
                {question: "下列哪一項技術開始針對 WiMAX 固接式網路規範？", options: [{text: "802.16-2004/802.16d", correct: true}, {text: "802.16-2005/802.16e", correct: false}, {text: "802.16-2009/802.16j", correct: false}, {text: "802.16-2012/802.16m", correct: false}]},
                {question: "下列哪一項技術開始增加 WiMAX 移動機制的修正案？", options: [{text: "802.16-2004/802.16d", correct: false}, {text: "802.16-2005/802.16e", correct: true}, {text: "802.16-2009/802.16j", correct: false}, {text: "802.16-2012/802.16m", correct: false}]},
                {question: "下列哪一項 WiMAX 技術為重新修正移動式網路的規範，並為現行的標準而實作的？", options: [{text: "802.16-2004 / 802.16d", correct: false}, {text: "802.16-2005 / 802.16e", correct: true}, {text: "802.16-2009 / 802.16j", correct: false}, {text: "802.16-2012 / 802.16m", correct: false}]},
                {question: "WiMAX-Advanced 下行可達哪個速率以上？", options: [{text: "50 Mbps", correct: false}, {text: "54 Mbps", correct: false}, {text: "70 Mbps", correct: false}, {text: "100 Mbps", correct: true}]},
                {question: "WiMAX 運用於最後一哩解決方案，其主要優勢不含？", options: [{text: "廣域覆蓋", correct: false}, {text: "高資料率", correct: false}, {text: "低佈建成本", correct: false}, {text: "極高移動速度", correct: true}]},
                {question: "各種無線網路的資料傳輸頻寬從最高到最低的正確順序是？", options: [{text: "ZigBee > Wi-Fi > WiMAX", correct: false}, {text: "WiMAX > ZigBee > Bluetooth", correct: false}, {text: "Bluetooth > ZigBee > Wi-Fi", correct: false}, {text: "Wi-Fi > Bluetooth > ZigBee", correct: true}]},
                {question: "WiMAX-Advanced 標準的 IEEE 版本號為何？", options: [{text: "802.16e", correct: false}, {text: "802.16k", correct: false}, {text: "802.16j", correct: false}, {text: "802.16m", correct: true}]},
                {question: "WiMAX 最初是以哪一頻段為主要運作範圍？", options: [{text: "2~11 GHz", correct: true}, {text: "5~6 GHz", correct: false}, {text: "800~900 MHz", correct: false}, {text: "60 GHz", correct: false}]},
                {question: "在 WiMAX 架構中，Relay Architecture 用以延伸覆蓋範圍的設施稱為？", options: [{text: "SS", correct: false}, {text: "MS", correct: false}, {text: "DS", correct: false}, {text: "RS", correct: true}]},
                {question: "在 handoff 中，先斷後連稱為？", options: [{text: "Hard Handoff", correct: true}, {text: "Break-before-make", correct: false}, {text: "Soft Handoff", correct: false}, {text: "Make-before-break", correct: false}]},
                {question: "在 OFDMA 框架圖中，子通道（Subchannel）與 OFDM symbol 所構成的矩形區域稱為？", options: [{text: "Subnet", correct: false}, {text: "Frame", correct: true}, {text: "Slot", correct: false}, {text: "Burst", correct: false}]},
                {question: "下列何者為 OFDM 技術的缺點？", options: [{text: "單一通道只能指派給單一用戶而會有嚴重的頻寬浪費問題", correct: false}, {text: "對頻率偏移極為敏感", correct: false}, {text: "多個調變後的子載波訊號的疊加會有瞬間尖峰訊號而致使訊號失真", correct: false}, {text: "全部皆是", correct: true}]},
                {question: "在 WiMAX 無線寬頻網路運作中，初始距離量測（Initial Ranging）使用何種機制解決競爭失敗？", options: [{text: "隨機背離", correct: false}, {text: "指數倒退", correct: true}, {text: "固定延遲", correct: false}, {text: "線性重試", correct: false}]},
                {question: "OFDMA 分散式子載波組合具有？", options: [{text: "較少符元", correct: false}, {text: "較低延遲", correct: false}, {text: "更高效率", correct: false}, {text: "更好頻道多樣性", correct: true}]},
                {question: "WiMAX 頻譜若採 2.4~2.69 GHz 將具有下列哪一項優勢？", options: [{text: "容易與WLAN設備整合", correct: true}, {text: "穿透性佳", correct: false}, {text: "高傳輸距離", correct: false}, {text: "不容易受干擾", correct: false}]},
                {question: "WiMAX 在 2.4GHz 和 5GHz 頻段屬於？", options: [{text: "Licensed Band", correct: false}, {text: "Unlicensed Band", correct: true}, {text: "Restricted Band", correct: false}, {text: "Shared Band", correct: false}]},
                {question: "在 Smart Antenna 運用中，最主要目的是？", options: [{text: "簡化框架", correct: false}, {text: "抑制干擾", correct: true}, {text: "提高速率", correct: false}, {text: "節省能量", correct: false}]},
                {question: "在 WiMAX 框架中，下行與上行之分時多工稱為？", options: [{text: "FDD", correct: false}, {text: "TDMA", correct: false}, {text: "TDD", correct: true}, {text: "OFDMA", correct: false}]},

                {question: "在車載隨意網路 (VANET) 中使用 GPSR 路由協定時，封包可能陷入何種狀態？", options: [{text: "隱藏節點", correct: false}, {text: "廣播風暴", correct: false}, {text: "區域最佳點", correct: true}, {text: "RTS/CTS 死結", correct: false}]},
                {question: "在車載隨意網路 (VANET) 研究文獻中，Network Mobility (NEMO) Protocol 若無可合作車輛取得 IP，最終仍可使用？", options: [{text: "GPS連線", correct: false}, {text: "UDP封包", correct: false}, {text: "ARP廣播", correct: false}, {text: "DHCP伺服器", correct: true}]},
                {question: "設計車載網路之位置資訊服務協定 (location service protocol) 時最主要的議題是？", options: [{text: "不要讓其他車輛知道自己車輛的位置資訊", correct: false}, {text: "可以有效而快速的知道自己車輛的位置資訊", correct: false}, {text: "可以有效而快速的知道自己車輛 GPS 經緯度", correct: false}, {text: "可以有效而快速的知道所欲通訊車輛的位置資訊", correct: true}]},
                {question: "在車載隨意網路 (VANET) 研究文獻中，RLSMP 中，「細胞領導者 (Cell Leader)」的主要工作為何？", options: [{text: "設定 MAC 參數", correct: false}, {text: "處理多播", correct: false}, {text: "執行路徑維護", correct: false}, {text: "蒐集並儲存細胞內車輛資訊", correct: true}]},

                {question: "在車載隨意網路 (VANET) 研究文獻中，DV-CAST 協定中，當 Vi車輪收到新廣播訊息且不是後來才出現時，會如何做？", options: [{text: "廣播抑制", correct: false}, {text: "立即直接向前面車輛轉傳", correct: false}, {text: "切換 MAC 參數", correct: false}, {text: "將訊息廣播至反方向行進的車輛", correct: true}]},
                {question: "在車載隨意網路 (VANET) 研究文獻 IP Address Passing 機制中，IP 位址傳遞後，接收車輛需送出何訊息更新 ARP？", options: [{text: "ARP Request", correct: false}, {text: "ICMP Echo", correct: false}, {text: "DHCP Discover", correct: false}, {text: "GARP", correct: true}]},
                {question: "在車載隨意網路架構中，RSU 通常部署於？", options: [{text: "車頂天線", correct: false}, {text: "車輛引擎艙", correct: false}, {text: "車輪行駛的道路中", correct: false}, {text: "路邊燈杆或交通號誌桿", correct: true}]},
                {question: "在車載隨意網路 (VANET) 中，IVC 代表何者？", options: [{text: "Internal Vehicle Communication", correct: false}, {text: "Inter-Vehicle Communication", correct: true}, {text: "Infrastructure-Vehicle Communication", correct: false}, {text: "Inter-Vehicle Control", correct: false}]},
                {question: "在車載隨意網路 (VANET) 研究文獻中，IVG 地理群播協定中，「危險區域 (risk area)」由哪兩項決定？", options: [{text: "車牌號碼與速度", correct: false}, {text: "MAC位址與頻段", correct: false}, {text: "RSU佈建與道路長度", correct: false}, {text: "車輛位置與行駛方向", correct: true}]},
                {question: "在車載隨意網路 (VANET) 研究文獻 Network Mobility (NEMO) Protocol 中的 Virtual Bus 方式，何者組成虛擬巴士以協助預先換手？", options: [{text: "反方向車輛", correct: false}, {text: "GPS 同步車輛", correct: false}, {text: "同一 RSU 覆蓋車輛", correct: false}, {text: "同向且有連通的車輛", correct: true}]},
                {question: "在車載隨意網路 (VANET) 研究文獻中，Mobicast 協定相較一般 Geocast 多考量哪個因素？", options: [{text: "MAC層", correct: false}, {text: "加密", correct: false}, {text: "車牌", correct: false}, {text: "時間", correct: true}]},
                {question: "在車載隨意網路 (VANET) 中，OBU 的 GPS 接收器主要提供？", options: [{text: "網路拓撲", correct: false}, {text: "加密金鑰", correct: false}, {text: "精確地理位置", correct: true}, {text: "車速統計", correct: false}]},
                {question: "在車載隨意網路 (VANET) 研究文獻中，為克服網路斷裂，Distributed Robust Geocast 不採用哪項方法？", options: [{text: "中心伺服器補播", correct: true}, {text: "週期性重送", correct: false}, {text: "反方向載送", correct: false}, {text: "新鄰居重轉", correct: false}]},
                {question: "專用短距離通訊 (DSRC) 的車載通訊服務使用了多少的頻帶？", options: [{text: "3.850~3.925GHz", correct: false}, {text: "6.850~6.925GHz", correct: false}, {text: "5.650~5.725GHz", correct: false}, {text: "5.850~5.925GHz", correct: true}]},
                {question: "802.11p WAVE 中用於高可用性低延遲的頻道編號是？", options: [{text: "172", correct: true}, {text: "174", correct: false}, {text: "176", correct: false}, {text: "178", correct: false}]},
                {question: "在車載隨意網路之路由選擇時，使用地理位址路由協定的優勢是？", options: [{text: "不需全域路由資訊", correct: true}, {text: "支援多播", correct: false}, {text: "無需 RSU", correct: false}, {text: "省電", correct: false}]},
                {question: "在車載隨意網路 (VANET) 中，換手 (handover) 時第三層延遲主要來自？", options: [{text: "GPS 同步", correct: false}, {text: "PHY 信號衰減", correct: false}, {text: "MAC 重新認證", correct: false}, {text: "IP 位址取得與路由更新", correct: true}]},
                {question: "下列何種不是車載隨意網路 (VANET) 應考慮的問題？", options: [{text: "省電是必須考量的重點", correct: true}, {text: "拓撲變化比無線隨意網路快速", correct: false}, {text: "車輛需要與路邊基地台的通訊", correct: false}, {text: "全部皆是", correct: false}]},
                {question: "車載資通訊系統中的「Telematics」是指哪兩部分的結合？", options: [{text: "通訊與資訊", correct: true}, {text: "GPS與RSU", correct: false}, {text: "感測器與顯示器", correct: false}, {text: "車輛與道路", correct: false}]},
                {question: "請問在車載通訊 DSRC 的架構中所規範的頻道，其 Control Channel 與 Service Channel 之個數分別為何？", options: [{text: "1個與6個", correct: true}, {text: "2個與5個", correct: false}, {text: "3個與4個", correct: false}, {text: "6個與1個", correct: false}]},
                {question: "車載資通訊網路的換手延遲主要在 OSI 的哪一層？", options: [{text: "第一層", correct: false}, {text: "第二層", correct: false}, {text: "第三層", correct: true}, {text: "第七層", correct: false}]},
                {question: "在車載隨意網路 (VANET) 研究文獻中，CAR 協定用於維護路徑並結合地理資訊的「衛兵 (guard)」不包括何者？", options: [{text: "TTL", correct: false}, {text: "來源路由", correct: true}, {text: "識別代號", correct: false}, {text: "位置與半徑", correct: false}]},
                {question: "何謂 On-Board Unit (OBU)？", options: [{text: "通訊控制單元", correct: false}, {text: "路側設施", correct: false}, {text: "面板單元", correct: false}, {text: "可移動的 WAVE 通訊單元", correct: true}]},
                {question: "何謂 Road-Side Unit (RSU)？", options: [{text: "WAVE 的通訊控制主機", correct: false}, {text: "WAVE 的通訊管理單元", correct: false}, {text: "WAVE 的訊息發佈單元", correct: false}, {text: "路側設施，為 WAVE中不會移動的通訊單元", correct: true}]},
                {question: "在車載隨意網路 (VANET) 研究文獻中，Delay-bounded routing 的D-MinCost策略在計算最小成本路徑時，成本指的是？", options: [{text: "能耗", correct: false}, {text: "路徑長度", correct: false}, {text: "加密開銷", correct: false}, {text: "forwarding 次數", correct: true}]},
                {question: "車載隨意網路 (VANET) 主要解決何種通訊場景？", options: [{text: "車輛對手機通訊", correct: false}, {text: "車輛內部裝置間通訊", correct: false}, {text: "車輛對雲端伺服器通訊", correct: false}, {text: "車輛間與車輛對路邊基礎設施通訊", correct: true}]},
                {question: "ZigBee協調器選擇最佳父節點的準則為？", options: [{text: "最低延遲", correct: false}, {text: "最少跳躍數", correct: false}, {text: "最大剩餘電量", correct: false}, {text: "距離 Sink 最近", correct: true}]},
                {question: "ZigBee FFD 的功能不包括？", options: [{text: "任務協調者", correct: false}, {text: "支援任何拓撲", correct: false}, {text: "與任何裝置通訊", correct: false}, {text: "只能與簡化功能裝置通訊", correct: true}]},
                {question: "ZigBee Beacon-Enabled模式下，降低能耗的機制為？", options: [{text: "定期時間同步", correct: true}, {text: "使用多通道", correct: false}, {text: "持續監聽", correct: false}, {text: "隨機後退", correct: false}]}
            ]
        };

        let currentChapter = null;
        let currentQuestionIndex = 0;
        let correctAnswers = 0;
        let wrongAnswers = 0;
        let shuffledQuestions = [];

        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function selectChapter(chapter) {
            currentChapter = chapter;

            if (chapter === 'all') {
                shuffledQuestions = shuffleArray([
                    ...allQuestions[5],
                    ...allQuestions[6],
                    ...allQuestions[7],
                    ...allQuestions[8],
                    ...allQuestions[9]
                ]);
                document.getElementById('headerTitle').textContent = '全章節測驗';
            } else {
                shuffledQuestions = shuffleArray(allQuestions[chapter]);
                const chapterNames = {
                    5: '第5章 - 無線寬頻網路',
                    6: '第6章 - 電信網路',
                    7: '第7章 - 水下感測網路',
                    8: '第8章 - 無線體域網路',
                    9: '第9章 - 車載資通訊網路'
                };
                document.getElementById('headerTitle').textContent = chapterNames[chapter];
            }

            currentQuestionIndex = 0;
            correctAnswers = 0;
            wrongAnswers = 0;

            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('quizContent').style.display = 'block';
            document.getElementById('scoreBoard').style.display = 'flex';
            document.getElementById('progressBarContainer').style.display = 'block';
            document.getElementById('totalQuestions').textContent = shuffledQuestions.length;

            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex >= shuffledQuestions.length) {
                showFinalScore();
                return;
            }

            const question = shuffledQuestions[currentQuestionIndex];

            document.getElementById('questionNumber').textContent = `第 ${currentQuestionIndex + 1} 題`;
            document.getElementById('currentQuestion').textContent = currentQuestionIndex + 1;
            document.getElementById('questionText').textContent = question.question;

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            question.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option';
                optionDiv.innerHTML = `
                    <div class="option-marker">${String.fromCharCode(65 + index)}</div>
                    <div>${option.text}</div>
                `;
                optionDiv.onclick = () => selectOption(optionDiv, option.correct, question.options);
                optionsContainer.appendChild(optionDiv);
            });

            document.getElementById('feedback').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';

            updateProgress();
        }

        function selectOption(selectedDiv, isCorrect, allOptions) {
            const options = document.querySelectorAll('.option');
            if (options[0].classList.contains('disabled')) return;

            options.forEach(opt => opt.classList.add('disabled'));

            if (isCorrect) {
                selectedDiv.classList.add('correct');
                correctAnswers++;
                document.getElementById('correctCount').textContent = correctAnswers;
                showFeedback(true);
            } else {
                selectedDiv.classList.add('wrong');
                wrongAnswers++;
                document.getElementById('wrongCount').textContent = wrongAnswers;

                options.forEach((opt, index) => {
                    if (allOptions[index].correct) {
                        opt.classList.add('correct');
                    }
                });
                showFeedback(false);
            }

            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        function showFeedback(isCorrect) {
            const feedback = document.getElementById('feedback');
            feedback.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
            feedback.textContent = isCorrect ? '✓ 答對了！做得好！' : '✗ 答錯了，正確答案已標示為綠色';
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function updateProgress() {
            const progress = (currentQuestionIndex / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showFinalScore() {
            const percentage = Math.round((correctAnswers / shuffledQuestions.length) * 100);
            let message = '';

            if (percentage >= 90) {
                message = '太棒了！您對無線網路知識掌握得非常好！';
            } else if (percentage >= 70) {
                message = '做得不錯！繼續加油！';
            } else if (percentage >= 60) {
                message = '還可以，再多複習一下會更好！';
            } else {
                message = '需要再加強喔！建議多複習相關知識。';
            }

            document.getElementById('quizContent').innerHTML = `
                <div class="final-score">
                    <h2>測驗完成！</h2>
                    <div class="score-display">${correctAnswers} / ${shuffledQuestions.length}</div>
                    <div class="message">${message}</div>
                    <div style="font-size: 18px; color: #666; margin-bottom: 20px;">
                        正確率：${percentage}%<br>
                        答對：${correctAnswers} 題<br>
                        答錯：${wrongAnswers} 題
                    </div>
                    <button class="btn btn-next" onclick="location.reload()">再測驗一次</button>
                    <button class="btn btn-back" onclick="backToMenu()">返回選單</button>
                </div>
            `;
        }

        function restartQuiz() {
            if (confirm('確定要重新開始嗎？目前的進度將會遺失。')) {
                if (currentChapter) {
                    selectChapter(currentChapter);
                }
            }
        }

        function backToMenu() {
            location.reload();
        }

        function showBankMenu() {
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('bankMenuContent').style.display = 'block';
            document.getElementById('headerTitle').textContent = '選擇題庫章節';
        }

        function viewQuestionBank(chapter) {
            const chapterNames = {
                5: '第5章 - 無線寬頻網路',
                6: '第6章 - 電信網路',
                7: '第7章 - 水下感測網路',
                8: '第8章 - 無線體域網路',
                9: '第9章 - 車載資通訊網路'
            };

            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('bankMenuContent').style.display = 'none';
            document.getElementById('questionBankContent').style.display = 'block';

            let chapters = [];
            let title = '';

            if (chapter === 'all') {
                chapters = [5, 6, 7, 8, 9];
                title = '全部章節題庫';
            } else {
                chapters = [chapter];
                title = chapterNames[chapter];
            }

            document.getElementById('headerTitle').textContent = title;

            const bankList = document.getElementById('questionBankList');
            bankList.innerHTML = '';

            chapters.forEach(chap => {
                if (chapter === 'all') {
                    const divider = document.createElement('div');
                    divider.className = 'chapter-divider';
                    divider.textContent = chapterNames[chap] + ` (${allQuestions[chap].length}題)`;
                    bankList.appendChild(divider);
                }

                allQuestions[chap].forEach((q, index) => {
                    const item = document.createElement('div');
                    item.className = 'bank-item';

                    const questionDiv = document.createElement('div');
                    questionDiv.className = 'bank-question';
                    questionDiv.textContent = `${index + 1}. ${q.question}`;
                    item.appendChild(questionDiv);

                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'bank-options';

                    q.options.forEach((opt, optIndex) => {
                        const optDiv = document.createElement('div');
                        optDiv.className = 'bank-option' + (opt.correct ? ' correct' : '');
                        optDiv.textContent = `${String.fromCharCode(65 + optIndex)}. ${opt.text}${opt.correct ? ' ✓ 正確答案' : ''}`;
                        optionsDiv.appendChild(optDiv);
                    });

                    item.appendChild(optionsDiv);
                    bankList.appendChild(item);
                });
            });
        }

        document.getElementById('nextBtn').addEventListener('click', nextQuestion);
        document.getElementById('restartBtn').addEventListener('click', restartQuiz);
        document.getElementById('backBtn').addEventListener('click', backToMenu);
    </script>
</body>
</html>
